# Stoker on EVM chains (#231): the contracts' own Foundry workspace (#241).
# The standards behind these settings: the evm-security-standards repository's tooling/foundry.toml.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Pinned, never floating. 0.8.26 is the version v4-core's PoolManager pins, which the local tests deploy.
solc_version = "0.8.26"
# v4's flash accounting needs transient storage (EIP-1153); every target chain supports Cancun.
evm_version = "cancun"
bytecode_hash = "none"
optimizer = true
optimizer_runs = 200
# The hook's fee paths need the IR pipeline (stack too deep under the legacy one).
via_ir = true
ffi = false
deny = "warnings"
# The deployment's scripts (#251) read each chain's settings, write a pending record and the rehearsal's
# notes under cache/, and read the published record back; nothing else of the disk is open to a script.
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "./script/config" },
  { access = "read-write", path = "./cache/deployments" },
  { access = "read", path = "../packages/evm/deployments" },
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
# Kept false: a handler input the system rightly refuses is not a failure.
fail_on_revert = false

# Deeper campaigns in CI, same properties.
[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 256
depth = 128

# The sources alone, built apart for Slither (#251, `script/gate.sh`). The default build's compiler input
# carries the helper files forge writes to link its tests, which no analyser can open, and Slither's own
# way of compiling a Foundry project forces a rebuild of everything; so the gate builds `src` here, into
# folders of its own, and hands Slither that build.
[profile.gate]
test = "gate-no-tests"
script = "gate-no-scripts"
out = "out-gate"
cache_path = "cache-gate"
build_info = true
dynamic_test_linking = false

[rpc_endpoints]
# An archive endpoint for Robinhood Chain (4663): the fork tests pin a block the public RPC no
# longer serves. Never print or commit the URL; it carries a key.
robinhood = "${ROBINHOOD_RPC_URL}"
# Testnet 46630, for the rehearsal (#251): `script/deploy.sh` sets it to the public RPC when the shell has none.
robinhood-testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

[fmt]
line_length = 120

[lint]
# CI lints `src` alone as its own step (`forge lint src`), where any warning fails; the tests' helpers
# are not held to it, so the build does not lint.
lint_on_build = false
