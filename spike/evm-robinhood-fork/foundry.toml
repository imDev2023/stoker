# Throwaway spike for #234 (part of #231): evidence, not production code.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
# v4's flash accounting needs transient storage (EIP-1153).
evm_version = "cancun"
bytecode_hash = "none"
optimizer = true
optimizer_runs = 200
# The hook's fee path has too many locals for the legacy pipeline (stack too deep).
via_ir = true
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 64

[rpc_endpoints]
# An archive endpoint is needed: the tests pin block 120,800,000 and the public RPC keeps
# only minutes of history. ROBINHOOD_RPC_URL is Alchemy's free tier in the owner's global env.
robinhood = "${ROBINHOOD_RPC_URL}"

[lint]
# Spike code: the v4 delta casts are checked by the tests, not annotated one by one.
lint_on_build = false
