name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manual run, to see what GitHub answers when no run ever starts on its own.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Includes the rule that keeps @launchpad/chain and the Raydium SDK out of the web app (ADR 0003).
      - run: pnpm lint
      - run: pnpm typecheck

  # The black-box backend suite: the API under wrangler, a real Postgres, and the local chain on Surfpool (the Raydium
  # devnet programs from fixtures, embedded in the test process; see tools/localnet), since runners have no
  # solana-test-validator. With the ROBINHOOD_RPC_URL secret the stack also forks Robinhood Chain under anvil with our
  # contracts deployed (#252); without it (a pull request from a fork gets no secrets) the EVM tests skip by name.
  backend:
    runs-on: ubuntu-latest
    # The suite takes 28 to 30 minutes on a runner (2026-11-16): at 30 the limit cancelled runs that had failed nothing.
    # 35 with the EVM side (2026-11-25), and #279 adds a stack of its own and the provider's tests to it.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # anvil, for the stack's fork of Robinhood Chain.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      # What the fork read at the pinned block, so a run reads the RPC only for state it has not seen.
      - uses: actions/cache@v6
        with:
          path: ~/.foundry/cache/rpc/4663
          key: backend-fork-4663-120800000-${{ hashFiles('tests/backend/src/evm*.ts') }}
          restore-keys: backend-fork-4663-120800000-
      - run: pnpm test:backend
        env:
          # Each suite makes its own throwaway database on this server (tools/stack).
          STACK_DATABASE_URL: postgres://test:test@127.0.0.1:5432/postgres
          LOCALNET_RUNTIME: surfpool
          WRANGLER_SEND_METRICS: "false"
          # An archive endpoint; the URL carries a key, which the stack keeps out of every log (tools/stack).
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}

  # The EVM contracts' Foundry workspace (contracts/, #241): its own job, apart from the site's.
  # Every test that needs no RPC runs on every push; the fork tests of Robinhood Chain run only where the
  # ROBINHOOD_RPC_URL secret exists (an archive endpoint; the URL carries a key and is never printed).
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/cache@v6
        with:
          path: contracts/lib
          key: contracts-lib-${{ hashFiles('contracts/script/deps.sh') }}
      - run: ./script/deps.sh
      - run: forge fmt --check
      # In parts (#251): one compiler process building everything at once reached 11 GB and took this runner down.
      - run: ./script/build.sh
      # The EVM package's ABIs and bytecode must be what this build gives (#252): rerun the script after a contract change.
      - run: node ../packages/evm/scripts/artifacts.mjs --check
      - run: forge lint src
      - run: forge test --no-match-path 'test/fork/**'
      # The security gate (#251, ADR 0030: what stands in an audit's place): solhint's errors, Slither against the
      # triaged set in slither.db.json, then the security standards' pre-deployment gate with Robinhood Chain's
      # profile, strict, so one item left failing or unanswered fails the push. The campaigns have just passed above.
      - run: pipx install slither-analyzer==0.11.3
      - run: python3 -c 'import yaml' || pip install --user --break-system-packages pyyaml
      - name: The security gate
        run: INVARIANTS_PASSED=1 ./script/gate.sh
      - uses: actions/cache@v6
        if: env.ROBINHOOD_RPC_URL != ''
        with:
          path: ~/.foundry/cache/rpc/4663
          key: contracts-fork-4663-120800000
      - name: Fork tests (Robinhood Chain, pinned block)
        if: env.ROBINHOOD_RPC_URL != ''
        run: forge test --match-path 'test/fork/**'
